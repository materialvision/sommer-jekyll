  <meta name="description" content="This is a short preview of the full 42 minute long video. 

Arkadia 02-22 is an audiovisual work based on a series of travels, experiments and performances in the Northern regions of Norway, Finland and Russia. The video and audio material are recorded with various equipment over the course of 20 years and re-composed and re-presented with the assistance of various machine learning techniques. 

In addition to the computer generated material, the work weaves in a number of new audiovisual performances based on local everyday experiences such as cloudberry picking, mosquito meditations, coffee fortune telling, a cat operating a camera, and investigating an old 78rpm vinyl record collection found in the attic.  

After the 2022 Russian invasion of Ukraine, the border between Norway and Russia closed and travels and cross-border collaborations seized. In this new situation, Arkadia 02-22 also become an exploration of how to rekindle the potential of this collaboration based on archival material from 20 years of cross-border activities.

Our consciousness and memory piece together a life-world. Our actions and movements within it make the rhythms of our imaginary home. Repetitions and rituals make us forget where it all started. But we never forget to bring our berry-picking bucket, just in case. 

Thank you Rural Reading Room (Kristin Tårnesvik, Hilde M. Methi, Morten Torgersrud), Venke Tørmenen, Honna Havas, Neal Cahoon, Ann-Inger Sommer and many more for contributing to the archive material. 

Arkadia 02-22 is one of det gode liv // The Sweetness of Living productions. It was developed in dialogue with Pikene på Broen for Barents Spektakel 2022 with additional support from Bergen Kommune, BEK, Billedkunstnernes Vederlagsfond and Kulturrådet.">
