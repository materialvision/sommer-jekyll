  <meta name="description" content="Espen Sommer Eide 2015

&#34;Material Vision – Silent Reading&#34;, is an artistic research project, which includes the creation of new musical instruments and a performance developed on the remote Bear Island in the Barents Sea, north of mainland Norway. Beeren Eiland was discovered and named by Dutch explorer Willem Barents in 1596, after being attacked by a polar bear on its shore. Later Norwegian geologist Balthazar Keilhau would describe the island as the “Cadaver of the Earth” due to its lack of vegetation and harsh weather conditions. “Material Vision – Silent Reading” investigates, through a combination of artistic and scientific performances, various ways of reading a landscape and how the seer and the seen relate to each other. For this project a mobile eye-tracking technology was developed, combined with instruments that give audible feedback to the reading of the arctic landscapes. 

Comissioned by UiT, the Arctic University of Norway. Installed at the Faculty of Science and Technology.

More info at http://sommer.alog.net/pages/53">
