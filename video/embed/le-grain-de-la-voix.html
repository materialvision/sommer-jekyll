  <title>Le Grain de la Voix · Espen Sommer Eide — Video</title>
  <meta name="description" content="The instrument is made for 4 singers and 1 conductor. The conductor controls the sounds that are played through four miniature speakers that are (more or less) inserted into the singers mouths. The singers then proceed to shape the sounds resonance with their mouth cavity as the resonant chamber. It is perhaps best described as reversing the speech direction, where I as the conductor supply what is normally the vocal chords or &#34;voice box&#34; job. The resulting piece is a polyphonic and minimalistic transformation of various vowel resonances. The title alludes to Roland Barthes famous essay on the grain of the voice, giving identity to the voice and reflects on the relationship between the voice and the subject.

The piece featured in the video was composed for coreographer Eva-Cecilie Richardsens perfomance &#34;Speaking and building&#34; in April 2012, Dansens Hus, Oslo.

The singers: Cecilie Lindeman Steen, Janne-Camilla Lyster, Gry Bech-Hanssen and Marte Vold
The conductor: Alexander Rishaug">
