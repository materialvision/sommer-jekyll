  <meta name="description" content="Inspired by the novel The Waves, by Virginia Woolf, Norwegian composer Espen Sommer Eide makes an eponymous spatial music album for Marres, House for Contemporary Culture. During the exhibtion, the album will ‘live’ inside the house as well as launched on vinyl at the opening on November 15th. The year preceding the opening of The Waves, and during other exhibitions, Espen Sommer Eide recorded nightly performances in the rooms of the house, together with the voice Mari Kvien Brunvoll and Martin Taxt on microtonal tuba. Jochem Vanden Ecker was asked to document the entire process. With these recordings, Sommer Eide composed a series of works that succeed each other in space and can be listened to either separately or joint together.

The Waves exhibited at Marres from 13 November 2019 until 2 February 2020. The album is available on Spotify and Soundcloud, and was brought out on vinyl by SOFA Music. 

For more information, please visit www.marres.org .">
