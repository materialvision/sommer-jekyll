  <meta name="description" content="The Ligetizer is a 6 metronome instrument designed and constructed by Espen Sommer Eide in 2011-12. It has been presented and performed on in various contexts like the Stedilijk Museum Hear It! series in Amsterdam, Borealis festival and Rad #4 Bergen, Norway and Mutek festival, Montreal. This video presents a short improvised piece on the instrument.

Each metronome has a particular function, made visual by the hypnotizing pendulum movement. It could be LFO, pitch control, note-pulses or other parameters. The metronomes are also interconnected to produce more complex rhythms and waveforms when running simultaniously. The instrument is connected to a suitable sound generating source via MIDI. For more info visit: http://sommer.alog.net/posts/242">
